<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a08">
  <meta name="description" content="Mythastria. A virtual tabletop where everyone plays in their own playstyle, together. Free to download and play.">
  <title>Mythastria</title>
  <link rel="canonical" href="https://mythastria.com/">
  <link rel="icon" type="image/png" href="mythastria-medallion.png">
  <meta property="og:title" content="Mythastria">
  <meta property="og:description" content="A virtual tabletop where everyone plays in their own playstyle, together. Free to download and play.">
  <meta property="og:image" content="https://mythastria.com/mythastria-logo.jpg">
  <meta property="og:type" content="website">
  <style>
    :root{color-scheme:dark;background:#0b0a08;color:#edce85}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(ellipse at center,#211b1038,transparent 70%),#0b0a08}
    main{width:min(100%,1100px);padding:clamp(18px,4vw,48px);text-align:center}
    .splash{position:relative;isolation:isolate;width:100%;margin:auto}
    .logo{display:block;width:100%;height:auto;max-height:66svh;object-fit:contain;filter:drop-shadow(0 18px 40px #0008)}
    .tagline{margin:clamp(16px,3vw,32px) 0 0;color:#bca775;font:clamp(15px,2vw,21px)/1.5 Georgia,"Times New Roman",serif;letter-spacing:.04em}
    .free{margin:clamp(6px,1vw,10px) 0 0;color:#edce85;font:600 clamp(16px,2.2vw,23px)/1.4 Georgia,"Times New Roman",serif;letter-spacing:.04em}
    .links{margin:clamp(12px,2vw,20px) 0 0}
    .note{margin:clamp(10px,1.5vw,16px) 0 0;color:#bca775;font:clamp(13px,1.5vw,15px)/1.5 Georgia,"Times New Roman",serif}
    .note a{color:#edce85}
    .links a{display:inline-block;margin:4px;padding:10px 20px;border:1px solid #a98b4a;border-radius:6px;background:#17130c;color:#edce85;font:clamp(15px,1.8vw,18px)/1.4 Georgia,"Times New Roman",serif;letter-spacing:.04em;text-decoration:none}
    .links a:hover,.links a:focus-visible{background:#2a2213;color:#ffe9b7;outline:2px solid #e8be6b;outline-offset:2px}
    @media(max-height:650px) and (min-width:700px){main{width:min(100%,820px);padding:16px}.logo{max-height:58svh;object-fit:contain}.tagline{margin-top:8px}}
  </style>
</head>
<body>
  <main aria-label="Mythastria">
    <div class="splash">
      <img class="logo" src="mythastria-logo.jpg" alt="Mythastria: a golden M sun above an illuminated stage and open book" width="1200" height="800" fetchpriority="high">
    </div>
    <p class="tagline">A virtual tabletop where everyone plays in their own playstyle, together.</p>
    <p class="free">Free to download and play.</p>
    <p class="links"><a href="https://github.com/islandfunster/mythastria/releases/latest">Get Mythastria</a> <a href="https://github.com/islandfunster/mythastria-adventure-packs">Seven Isles: a free adventure</a> <a href="https://discord.gg/cgtkjHSKjX">Join Mythastria on Discord</a> <a href="tour.html">Take the tour</a></p>
    <p class="note">For Windows 10 or 11, 64-bit. Nothing to install. <a href="https://github.com/islandfunster/mythastria">The source code</a> is on GitHub.</p>
  </main>
</body>
</html>
