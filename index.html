<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a08">
  <meta name="description" content="Mythastria. Coming soon.">
  <title>Mythastria — Coming Soon</title>
  <link rel="canonical" href="https://mythastria.com/">
  <link rel="icon" type="image/png" href="mythastria-medallion.png">
  <meta property="og:title" content="Mythastria — Coming Soon">
  <meta property="og:description" content="Wonderful adventures, together. Coming soon.">
  <meta property="og:image" content="https://mythastria.com/mythastria-logo.jpg">
  <meta property="og:type" content="website">
  <style>
    :root{color-scheme:dark;background:#0b0a08;color:#edce85}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(ellipse at center,#211b1038,transparent 70%),#0b0a08}
    main{width:min(100%,1100px);padding:clamp(18px,4vw,48px);text-align:center}
    .splash{position:relative;isolation:isolate;width:100%;margin:auto}
    .logo{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 40px #0008)}
    .banner{position:absolute;left:50%;top:49%;width:98%;transform:translate(-50%,-50%) rotate(-16deg);padding:clamp(12px,2.7vw,30px) 8px;background:linear-gradient(110deg,#a91e22,#6b1017);border-block:2px solid #e8be6b;box-shadow:0 8px 25px #000a;color:#ffe9b7;font:800 clamp(23px,6.4vw,76px)/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;text-shadow:0 3px 1px #35060b;white-space:nowrap;user-select:none}
    .tagline{margin:clamp(16px,3vw,32px) 0 0;color:#bca775;font:clamp(15px,2vw,21px)/1.5 Georgia,"Times New Roman",serif;letter-spacing:.04em}
    @media(max-height:650px) and (min-width:700px){main{width:min(100%,820px);padding:16px}.logo{max-height:78svh;object-fit:contain}.tagline{margin-top:8px}}
  </style>
</head>
<body>
  <main aria-label="Mythastria — Coming soon">
    <div class="splash">
      <img class="logo" src="mythastria-logo.jpg" alt="Mythastria: a golden M sun above an illuminated stage and open book" width="1200" height="800" fetchpriority="high">
      <div class="banner">COMING SOON</div>
    </div>
    <p class="tagline">Wonderful adventures, together.</p>
  </main>
</body>
</html>
