<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythastria — Give back</title>
<link rel="icon" type="image/png" href="icon.png"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="skins.css"><link rel="stylesheet" href="icons.css"><script type="module" src="site.mjs"></script>
<style>
/* GIVE-BACK-01 (GM 2026-11-02: "It's appeal that folks that play games have leisure time not to forget that there are
   needy people in the world. Please donate to local volunteer efforts whether it's your time or money."): the GM's
   appeal, on the GM's pages and the players' door. It links to no charity and takes no money. */
main{max-width:640px;margin:0 auto;padding:2rem 1rem}
main section.panel{padding:1.5rem}
main h2{margin:0 0 .75rem}
.appeal{font-size:1.2rem;line-height:1.6;margin:0 0 .75rem}
.note{color:var(--muted);margin:1rem 0 0}
</style></head>
<body>
<header class="site-header" data-page="give"></header>
<main>
<section class="panel"><h2>Give back</h2>
 <p class="appeal">Those of us who play games have leisure time. Let's not forget that there are needy people in the world.</p>
 <p class="appeal">Please donate to local volunteer efforts, whether it's your time or your money.</p>
 <p class="note">Mythastria takes no money and collects for no one. Your help goes straight to the people near you.</p>
</section>
</main>
</body></html>
